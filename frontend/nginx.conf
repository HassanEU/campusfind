server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Same-origin API: the browser talks to this host, nginx forwards to the
    # API container. Works for localhost, a LAN IP, and a deployed hostname
    # without baking any URL into the JavaScript bundle.
    location /api/ {
        proxy_pass http://api:4001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Hashed asset filenames change whenever the content changes, so they can be
    # cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # index.html itself must never be cached, otherwise a browser keeps loading
    # the previous build's asset names after a deploy.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # CampusFind is a single-page app: every unknown path is a client route and
    # has to fall through to index.html rather than return 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
